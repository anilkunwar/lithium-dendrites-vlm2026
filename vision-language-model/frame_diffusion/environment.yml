# conda env create -f frame_diffusion/environment.yml && conda activate pytorch
# torch 2.7.1+cu128 runs on Blackwell (sm_120, needs driver >= 570) and on RTX 3090 (sm_86).
name: pytorch
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1
      - numpy==1.26.4
      - scipy==1.13.1
      - matplotlib==3.4.3
      - scikit-image==0.18.3
      - tqdm==4.67.1
      - safetensors==0.4.5
      - huggingface_hub==0.26.1
      - diffusers==0.31.0
      - accelerate==1.1.1
      - netCDF4  # only for step0_make_dataset_from_exodus.py
